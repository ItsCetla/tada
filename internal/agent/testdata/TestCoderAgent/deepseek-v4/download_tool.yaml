t commit, a new or amended commit message, or a pull request title and body.</skill>\\n<skill name=\\\"jq\\\" location=\\\"tada://skills/jq/SKILL.md\\\" type=\\\"builtin\\\">Use when the user needs to query, filter, reshape or construct JSON data, or to write or debug a jq program.</skill>\\n<skill name=\\\"tada-hooks\\\" location=\\\"tada://skills/tada-hooks/SKILL.md\\\" type=\\\"builtin\\\">Use to add, write, debug or configure a Ta-Da hook that gates, rewrites or adds context to tool calls.</skill>\\n</available_skills>\\n\\n<skills_usage>\\nWhen a skill matches the task, View its `location` exactly as shown and follow the whole SKILL.md before any tool call that does the task; never infer a skill's behavior from its name or description. `tada://skills/...` locations are virtual, not URLs or MCP resources: load them with View, never with MCP tools.\\n</skills_usage>\\n\\n<env>\\nWorking directory: /tmp/crush-test/TestCoderAgent/deepseek-v4/download_tool\\nIs directory a git repo: no\\nPlatform: linux\\nToday's date: 1/1/2025\\n</env>\",\"role\":\"system\"},{\"content\":\"download the file from https://example-files.online-convert.com/document/txt/example.txt and save it as example.txt\",\"role\":\"user\"},{\"content\":\"\\n\\n\",\"tool_calls\":[{\"id\":\"call_0af83cc61221ada5\",\"function\":{\"arguments\":\"{\\\"file_path\\\":\\\"/tmp/crush-test/TestCoderAgent/deepseek-v4/download_tool/example.txt\\\",\\\"url\\\":\\\"https://example-files.online-convert.com/document/txt/example.txt\\\"}\",\"name\":\"download\"},\"type\":\"function\"}],\"role\":\"assistant\"},{\"content\":\"Successfully downloaded 2574 bytes to example.txt (Content-Type: text/plain; charset=UTF-8)\",\"tool_call_id\":\"call_0af83cc61221ada5\",\"role\":\"tool\"},{\"content\":\"\\n\\n\",\"tool_calls\":[{\"id\":\"call_b8197b18a8f675d6\",\"function\":{\"arguments\":\"{\\\"file_path\\\":\\\"/tmp/crush-test/TestCoderAgent/deepseek-v4/download_tool/example.txt\\\"}\",\"name\":\"view\"},\"type\":\"function\"}],\"role\":\"assistant\"},{\"content\":\"<file>\\n     1|TXT test file\\n     2|Purpose: Provide example of this file type\\n     3|Document file type: TXT\\n     4|Version: 1.0\\n     5|Remark:\\n     6|\\n     7|Example content:\\n     8|The names \\\"John Doe\\\" for males, \\\"Jane Doe\\\" or \\\"Jane Roe\\\" for females, or \\\"Jonnie Doe\\\" and \\\"Janie Doe\\\" for children, or just \\\"Doe\\\" non-gender-specifically are used as placeholder names for a party whose true identity is unknown or must be withheld in a legal action, case, or discussion. The names are also used to refer to acorpse or hospital patient whose identity is unknown. This practice is widely used in the United States and Canada, but is rarely used in other English-speaking countries including the United Kingdom itself, from where the use of \\\"John Doe\\\" in a legal context originates. The names Joe Bloggs or John Smith are used in the UK instead, as well as in Australia and New Zealand.\\n     9|\\n    10|John Doe is sometimes used to refer to a typical male in other contexts as well, in a similar manner to John Q. Public, known in Great Britain as Joe Public, John Smith or Joe Bloggs. For example, the first name listed on a form is often John Doe, along with a fictional address or other fictional information to provide an example of how to fill in the form. The name is also used frequently in popular culture, for example in the Frank Capra film Meet John Doe. John Doe was also the name of a 2002 American television series.\\n    11|\\n    12|Similarly, a child or baby whose identity is unknown may be referred to as Baby Doe. A notorious murder case in Kansas City, Missouri, referred to the baby victim as Precious Doe. Other unidentified female murder victims are Cali Doe and Princess Doe. Additional persons may be called James Doe, Judy Doe, etc. However, to avoid possible confusion, if two anonymous or unknown parties are cited in a specific case or action, the surnames Doe and Roe may be used simultaneously; for example, \\\"John Doe v. Jane Roe\\\". If several anonymous parties are referenced, they may simply be labelled John Doe #1, John Doe #2, etc. (the U.S. Operation Delego cited 21 (numbered) \\\"John Doe\\\"s) or labelled with other variants of Doe / Roe / Poe / etc. Other early alternatives such as John Stiles and Richard Miles are now rarely used, and Mary Major has been used in some American federal cases.\\n    13|\\n    14|\\n    15|\\n    16|File created by https://www.online-convert.com\\n    17|More example files: https://www.online-convert.com/file-type\\n    18|Text of Example content: Wikipedia (https://en.wikipedia.org/wiki/John_Doe)\\n    19|License: Attribution-ShareAlike 4.0 (https://creativecommons.org/licenses/by-sa/4.0/)\\n    20|\\n    21|Feel free to use and share the file according to the license above.\\n</file>\\n\",\"tool_call_id\":\"call_b8197b18a8f675d6\",\"role\":\"tool\"}],\"model\":\"deepseek-v4-pro-0813\",\"stream\":true,\"stream_options\":{\"include_usage\":true},\"tool_choice\":\"auto\",\"tools\":[{\"function\":{\"name\":\"bash\",\"strict\":false,\"description\":\"Run a command in a fresh mvdan/sh shell (Bash-compatible; forward slashes, absolute paths, no `cd`). Always set `description`.\\n- Banned (error; tell the user): curl, wget, ssh, package managers, sudo, system admin. HTTP: use the fetch tool.\\n- Use the grep/glob/view/ls tools, not find/grep/cat/head/tail/ls.\\n- Output over 30000 chars is cut to its first and last half plus a file with all of it: grep or view that, don't rerun.\\n- After `auto_background_after` s (default 60) a command becomes a background job.\\n- Servers/watchers: run_in_background=true, never a trailing `&`; job_output reads, job_kill stops. Builds, tests, git: foreground.\\n\\n<git>\\n- Commit, push or PR only when asked; no git config edits, -i flags or empty commits.\\n- First load the `git-commit` skill.\\n- End commit messages, after a blank line, with:\\n  \U0001F498 Generated with Ta-Da\\n  Co-Authored-By: Ta-Da <tada@cetla.dev>\\n- End PR bodies with: \U0001F498 Generated with Ta-Da\\n</git>\\n\",\"parameters\":{\"properties\":{\"auto_background_after\":{\"description\":\"Seconds before moving to the background (default 60)\",\"type\":\"integer\"},\"command\":{\"description\":\"Command to run\",\"type\":\"string\"},\"description\":{\"description\":\"What the command does, in a few words\",\"type\":\"string\"},\"run_in_background\":{\"description\":\"Run as a background job\",\"type\":\"boolean\"},\"working_dir\":{\"description\":\"Working directory (default: current)\",\"type\":\"string\"}},\"required\":[\"description\",\"command\"],\"type\":\"object\"}},\"type\":\"function\"},{\"function\":{\"name\":\"download\",\"strict\":false,\"description\":\"Download a URL directly to a local file (binary-safe, streaming, max 600s timeout); overwrites without warning. For reading content into context use fetch.\\n\",\"parameters\":{\"properties\":{\"file_path\":{\"description\":\"The local file path where the downloaded content should be saved\",\"type\":\"string\"},\"timeout\":{\"description\":\"Optional timeout in seconds (max 600)\",\"type\":\"integer\"},\"url\":{\"description\":\"The URL to download from\",\"type\":\"string\"}},\"required\":[\"url\",\"file_path\"],\"type\":\"object\"}},\"type\":\"function\"},{\"function\":{\"name\":\"edit\",\"strict\":false,\"description\":\"Exact find-and-replace in a file.\\n- View it first; copy old_string exactly (whitespace, blank lines), with 3-5 lines of context so it matches once.\\n- An indentation-only mismatch is still applied and re-indented; the response says so, check it.\\n- On \\\"not found\\\", view again and copy the exact text; never guess.\\n- Don't re-read after success.\\n- Several changes to one file: multiedit. Rewrites: write. Prefer `lsp_replace_symbol`/`lsp_rename` when available.\\n\",\"parameters\":{\"properties\":{\"file_path\":{\"description\":\"Absolute file path\",\"type\":\"string\"},\"new_string\":{\"description\":\"Replacement text\",\"type\":\"string\"},\"old_string\":{\"description\":\"Exact text to replace\",\"type\":\"string\"},\"replace_all\":{\"description\":\"Replace every match\",\"type\":\"boolean\"}},\"required\":[\"file_path\",\"old_string\",\"new_string\"],\"type\":\"object\"}},\"type\":\"function\"},{\"function\":{\"name\":\"multiedit\",\"strict\":false,\"description\":\"Several find-and-replace edits to one file. Each old_string is matched against the original file, so order doesn't matter; edits must cover disjoint regions (merge overlaps). All-or-nothing: on any failure nothing is applied and every failure is reported; fix and resend all. The edit tool's rules apply to each entry.\\n\",\"parameters\":{\"properties\":{\"edits\":{\"items\":{\"properties\":{\"new_string\":{\"description\":\"Replacement text\",\"type\":\"string\"},\"old_string\":{\"description\":\"Exact text to replace\",\"type\":\"string\"},\"replace_all\":{\"description\":\"Replace every match\",\"type\":\"boolean\"}},\"required\":[\"old_string\",\"new_string\"],\"type\":\"object\"},\"type\":\"array\"},\"file_path\":{\"description\":\"Absolute file path\",\"type\":\"string\"}},\"required\":[\"file_path\",\"edits\"],\"type\":\"object\"}},\"type\":\"function\"},{\"function\":{\"name\":\"fetch\",\"strict\":false,\"description\":\"Fetch raw content from a URL as text, markdown, or html (max 100KB); no AI processing. For analysis or extraction use agentic_fetch.\\n\",\"parameters\":{\"properties\":{\"format\":{\"description\":\"The format to return the content in (text, markdown, or html)\",\"type\":\"string\"},\"timeout\":{\"description\":\"Optional timeout in seconds (max 120)\",\"type\":\"integer\"},\"url\":{\"description\":\"The URL to fetch content from\",\"type\":\"string\"}},\"required\":[\"url\",\"format\"],\"type\":\"object\"}},\"type\":\"function\"},{\"function\":{\"name\":\"glob\",\"strict\":false,\"description\":\"Find files by glob pattern, newest first; skips hidden files. Capped at 100 results; narrow the pattern or path to see more. Use grep for contents.\\n\",\"parameters\":{\"properties\":{\"path\":{\"description\":\"Directory (default: cwd)\",\"type\":\"string\"},\"pattern\":{\"description\":\"Glob pattern\",\"type\":\"string\"}},\"required\":[\"pattern\"],\"type\":\"object\"}},\"type\":\"function\"},{\"function\":{\"name\":\"grep\",\"strict\":false,\"description\":\"Search file contents by regex or literal text; matches grouped by file, newest first; respects .gitignore. Capped at 100 matches or 50KB, lines cut at 500 bytes; narrow pattern, path or include to see more. Use glob for filenames.\\n\",\"parameters\":{\"properties\":{\"include\":{\"description\":\"File glob, e.g. \\\"*.{ts,tsx}\\\"\",\"type\":\"string\"},\"literal_text\":{\"description\":\"Match pattern as literal text\",\"type\":\"boolean\"},\"path\":{\"description\":\"Directory (default: cwd)\",\"type\":\"string\"},\"pattern\":{\"description\":\"Regex to search for\",\"type\":\"string\"}},\"required\":[\"pattern\"],\"type\":\"object\"}},\"type\":\"function\"},{\"function\":{\"name\":\"ls\",\"strict\":false,\"description\":\"List a directory as a tree; skips hidden files and common system dirs. Capped at 1000 entries; past that, list a subdirectory or use glob.\\n\",\"parameters\":{\"properties\":{\"depth\":{\"description\":\"Max depth\",\"type\":\"integer\"},\"ignore\":{\"description\":\"Glob patterns to skip\",\"items\":{\"type\":\"string\"},\"type\":\"array\"},\"path\":{\"description\":\"Directory (default: cwd)\",\"type\":\"string\"}},\"required\":[],\"type\":\"object\"}},\"type\":\"function\"},{\"function\":{\"name\":\"sourcegraph\",\"strict\":false,\"description\":\"Search code across public GitHub repositories via Sourcegraph; supports regex, language/repo/file filters, and symbol search (max 20 results). Only searches public repos.\\n\",\"parameters\":{\"properties\":{\"context_window\":{\"description\":\"The context around the match to return (default: 10 lines)\",\"type\":\"integer\"},\"count\":{\"description\":\"Optional number of results to return (default: 10, max: 20)\",\"type\":\"integer\"},\"query\":{\"description\":\"The Sourcegraph search query\",\"type\":\"string\"},\"timeout\":{\"description\":\"Optional timeout in seconds (max 120)\",\"type\":\"integer\"}},\"required\":[\"query\"],\"type\":\"object\"}},\"type\":\"function\"},{\"function\":{\"name\":\"view\",\"strict\":false,\"description\":\"Read a file with line numbers; renders images (PNG, JPEG, GIF, WebP); use ls for directories. Shows up to 200 lines or 200KB, lines over 2000 bytes cut; use offset (0-based) and limit to read the rest of large files. Don't re-read unchanged files.\\n\",\"parameters\":{\"properties\":{\"file_path\":{\"description\":\"File path\",\"type\":\"string\"},\"limit\":{\"description\":\"Lines to read (default 200)\",\"type\":\"integer\"},\"offset\":{\"description\":\"Start line (0-based)\",\"type\":\"integer\"}},\"required\":[\"file_path\"],\"type\":\"object\"}},\"type\":\"function\"},{\"function\":{\"name\":\"write\",\"strict\":false,\"description\":\"Create or overwrite a file, creating parent dirs; cannot append. View an existing file before overwriting it. For targeted changes use edit or multiedit.\\n\",\"parameters\":{\"properties\":{\"content\":{\"description\":\"Full file content\",\"type\":\"string\"},\"file_path\":{\"description\":\"File path\",\"type\":\"string\"}},\"required\":[\"file_path\",\"content\"],\"type\":\"object\"}},\"type\":\"function\"}]}"
