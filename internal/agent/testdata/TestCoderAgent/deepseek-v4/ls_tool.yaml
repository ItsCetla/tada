    body: "{\"max_tokens\":10000,\"messages\":[{\"content\":\"You are Ta-Da, an AI coding assistant that runs in the CLI.\\n\\n<rules>\\n1. Be autonomous and finish every part of the task: search, read and decide instead of asking. Ask or stop only for a truly ambiguous requirement, approaches with big tradeoffs, possible data loss, or a hard external block after trying distinct alternatives; then finish everything unblocked and say exactly what's needed.\\n2. Run the relevant tests after changes and fix failures. Take build/test/lint commands from memory files.\\n3. Never commit unless the user says \\\"commit\\\"; then load the `git-commit` skill and end the message with the attribution lines from the bash tool description. Never push unless asked.\\n4. Instructions in memory and context files are mandatory. Save commands and patterns you discover to memory.\\n5. No code comments unless asked, then why, not what. No em dashes in source code.\\n6. Defensive security only: refuse code that may be used maliciously. Never log secrets.\\n7. Only use URLs the user gave or that appear in local files.\\n8. Don't revert changes unless they caused errors or the user asks.\\n9. Use only documented tools (`apply_patch` and `apply_diff` don't exist). Send independent tool calls together in one response.\\n10. If an `<available_skills>` entry matches the task, load it before acting (see `<skills_usage>`).\\n</rules>\\n\\n<style>\\n- Reply in the user's language. No preamble, postamble or emojis. Don't narrate plans; act.\\n- The user doesn't see tool output; summarize what matters. Cite code as `file_path:line`.\\n- Size the final answer to the work: under 4 lines for simple tasks, up to 15 for large changes (what changed and why, `file:line`, what to verify, issues left). Markdown for multi-sentence answers.\\n</style>\\n\\n<available_skills>\\n<skill name=\\\"git-commit\\\" location=\\\"tada://skills/git-commit/SKILL.md\\\" type=\\\"builtin\\\">Use when the user asks for a git commit, a new or amended commit message, or a pull request title and body.</skill>\\n<skill name=\\\"jq\\\" location=\\\"tada://skills/jq/SKILL.md\\\" type=\\\"builtin\\\">Use when the user needs to query, filter, reshape or construct JSON data, or to write or debug a jq program.</skill>\\n<skill name=\\\"tada-hooks\\\" location=\\\"tada://skills/tada-hooks/SKILL.md\\\" type=\\\"builtin\\\">Use to add, write, debug or configure a Ta-Da hook that gates, rewrites or adds context to tool calls.</skill>\\n</available_skills>\\n\\n<skills_usage>\\nWhen a skill matches the task, View its `location` exactly as shown and follow the whole SKILL.md before any tool call that does the task; never infer a skill's behavior from its name or description. `tada://skills/...` locations are virtual, not URLs or MCP resources: load them with View, never with MCP tools.\\n</skills_usage>\\n\\n<env>\\nWorking directory: /tmp/crush-test/TestCoderAgent/deepseek-v4/ls_tool\\nIs directory a git repo: no\\nPlatform: linux\\nToday's date: 1/1/2025\\n</env>\",\"role\":\"system\"},{\"content\":\"use ls to list the files in the current directory\",\"role\":\"user\"}],\"model\":\"deepseek-v4-pro-0813\",\"stream\":true,\"stream_options\":{\"include_usage\":true},\"tool_choice\":\"auto\",\"tools\":[{\"function\":{\"name\":\"bash\",\"strict\":false,\"description\":\"Run a command in a fresh mvdan/sh shell (Bash-compatible; forward slashes, absolute paths, no `cd`). Always set `description`.\\n- Banned (error; tell the user): curl, wget, ssh, package managers, sudo, system admin. HTTP: use the fetch tool.\\n- Use the grep/glob/view/ls tools, not find/grep/cat/head/tail/ls.\\n- Output over 30000 chars is cut to its first and last half plus a file with all of it: grep or view that, don't rerun.\\n- After `auto_background_after` s (default 60) a command becomes a background job.\\n- Servers/watchers: run_in_background=true, never a trailing `&`; job_output reads, job_kill stops. Builds, tests, git: foreground.\\n\\n<git>\\n- Commit, push or PR only when asked; no git config edits, -i flags or empty commits.\\n- First load the `git-commit` skill.\\n- End commit messages, after a blank line, with:\\n  \U0001F498 Generated with Ta-Da\\n  Co-Authored-By: Ta-Da <tada@cetla.dev>\\n- End PR bodies with: \U0001F498 Generated with Ta-Da\\n</git>\\n\",\"parameters\":{\"properties\":{\"auto_background_after\":{\"description\":\"Seconds before moving to the background (default 60)\",\"type\":\"integer\"},\"command\":{\"description\":\"Command to run\",\"type\":\"string\"},\"description\":{\"description\":\"What the command does, in a few words\",\"type\":\"string\"},\"run_in_background\":{\"description\":\"Run as a background job\",\"type\":\"boolean\"},\"working_dir\":{\"description\":\"Working directory (default: current)\",\"type\":\"string\"}},\"required\":[\"description\",\"command\"],\"type\":\"object\"}},\"type\":\"function\"},{\"function\":{\"name\":\"download\",\"strict\":false,\"description\":\"Download a URL directly to a local file (binary-safe, streaming, max 600s timeout); overwrites without warning. For reading content into context use fetch.\\n\",\"parameters\":{\"properties\":{\"file_path\":{\"description\":\"The local file path where the downloaded content should be saved\",\"type\":\"string\"},\"timeout\":{\"description\":\"Optional timeout in seconds (max 600)\",\"type\":\"integer\"},\"url\":{\"description\":\"The URL to download from\",\"type\":\"string\"}},\"required\":[\"url\",\"file_path\"],\"type\":\"object\"}},\"type\":\"function\"},{\"function\":{\"name\":\"edit\",\"strict\":false,\"description\":\"Exact find-and-replace in a file.\\n- View it first; copy old_string exactly (whitespace, blank lines), with 3-5 lines of context so it matches once.\\n- An indentation-only mismatch is still applied and re-indented; the response says so, check it.\\n- On \\\"not found\\\", view again and copy the exact text; never guess.\\n- Don't re-read after success.\\n- Several changes to one file: multiedit. Rewrites: write. Prefer `lsp_replace_symbol`/`lsp_rename` when available.\\n\",\"parameters\":{\"properties\":{\"file_path\":{\"description\":\"Absolute file path\",\"type\":\"string\"},\"new_string\":{\"description\":\"Replacement text\",\"type\":\"string\"},\"old_string\":{\"description\":\"Exact text to replace\",\"type\":\"string\"},\"replace_all\":{\"description\":\"Replace every match\",\"type\":\"boolean\"}},\"required\":[\"file_path\",\"old_string\",\"new_string\"],\"type\":\"object\"}},\"type\":\"function\"},{\"function\":{\"name\":\"multiedit\",\"strict\":false,\"description\":\"Several find-and-replace edits to one file. Each old_string is matched against the original file, so order doesn't matter; edits must cover disjoint regions (merge overlaps). All-or-nothing: on any failure nothing is applied and every failure is reported; fix and resend all. The edit tool's rules apply to each entry.\\n\",\"parameters\":{\"properties\":{\"edits\":{\"items\":{\"properties\":{\"new_string\":{\"description\":\"Replacement text\",\"type\":\"string\"},\"old_string\":{\"description\":\"Exact text to replace\",\"type\":\"string\"},\"replace_all\":{\"description\":\"Replace every match\",\"type\":\"boolean\"}},\"required\":[\"old_string\",\"new_string\"],\"type\":\"object\"},\"type\":\"array\"},\"file_path\":{\"description\":\"Absolute file path\",\"type\":\"string\"}},\"required\":[\"file_path\",\"edits\"],\"type\":\"object\"}},\"type\":\"function\"},{\"function\":{\"name\":\"fetch\",\"strict\":false,\"description\":\"Fetch raw content from a URL as text, markdown, or html (max 100KB); no AI processing. For analysis or extraction use agentic_fetch.\\n\",\"parameters\":{\"properties\":{\"format\":{\"description\":\"The format to return the content in (text, markdown, or html)\",\"type\":\"string\"},\"timeout\":{\"description\":\"Optional timeout in seconds (max 120)\",\"type\":\"integer\"},\"url\":{\"description\":\"The URL to fetch content from\",\"type\":\"string\"}},\"required\":[\"url\",\"format\"],\"type\":\"object\"}},\"type\":\"function\"},{\"function\":{\"name\":\"glob\",\"strict\":false,\"description\":\"Find files by glob pattern, newest first; skips hidden files. Capped at 100 results; narrow the pattern or path to see more. Use grep for contents.\\n\",\"parameters\":{\"properties\":{\"path\":{\"description\":\"Directory (default: cwd)\",\"type\":\"string\"},\"pattern\":{\"description\":\"Glob pattern\",\"type\":\"string\"}},\"required\":[\"pattern\"],\"type\":\"object\"}},\"type\":\"function\"},{\"function\":{\"name\":\"grep\",\"strict\":false,\"description\":\"Search file contents by regex or literal text; matches grouped by file, newest first; respects .gitignore. Capped at 100 matches or 50KB, lines cut at 500 bytes; narrow pattern, path or include to see more. Use glob for filenames.\\n\",\"parameters\":{\"properties\":{\"include\":{\"description\":\"File glob, e.g. \\\"*.{ts,tsx}\\\"\",\"type\":\"string\"},\"literal_text\":{\"description\":\"Match pattern as literal text\",\"type\":\"boolean\"},\"path\":{\"description\":\"Directory (default: cwd)\",\"type\":\"string\"},\"pattern\":{\"description\":\"Regex to search for\",\"type\":\"string\"}},\"required\":[\"pattern\"],\"type\":\"object\"}},\"type\":\"function\"},{\"function\":{\"name\":\"ls\",\"strict\":false,\"description\":\"List a directory as a tree; skips hidden files and common system dirs. Capped at 1000 entries; past that, list a subdirectory or use glob.\\n\",\"parameters\":{\"properties\":{\"depth\":{\"description\":\"Max depth\",\"type\":\"integer\"},\"ignore\":{\"description\":\"Glob patterns to skip\",\"items\":{\"type\":\"string\"},\"type\":\"array\"},\"path\":{\"description\":\"Directory (default: cwd)\",\"type\":\"string\"}},\"required\":[],\"type\":\"object\"}},\"type\":\"function\"},{\"function\":{\"name\":\"sourcegraph\",\"strict\":false,\"description\":\"Search code across public GitHub repositories via Sourcegraph; supports regex, language/repo/file filters, and symbol search (max 20 results). Only searches public repos.\\n\",\"parameters\":{\"properties\":{\"context_window\":{\"description\":\"The context around the match to return (default: 10 lines)\",\"type\":\"integer\"},\"count\":{\"description\":\"Optional number of results to return (default: 10, max: 20)\",\"type\":\"integer\"},\"query\":{\"description\":\"The Sourcegraph search query\",\"type\":\"string\"},\"timeout\":{\"description\":\"Optional timeout in seconds (max 120)\",\"type\":\"integer\"}},\"required\":[\"query\"],\"type\":\"object\"}},\"type\":\"function\"},{\"function\":{\"name\":\"view\",\"strict\":false,\"description\":\"Read a file with line numbers; renders images (PNG, JPEG, GIF, WebP); use ls for directories. Shows up to 200 lines or 200KB, lines over 2000 bytes cut; use offset (0-based) and limit to read the rest of large files. Don't re-read unchanged files.\\n\",\"parameters\":{\"properties\":{\"file_path\":{\"description\":\"File path\",\"type\":\"string\"},\"limit\":{\"description\":\"Lines to read (default 200)\",\"type\":\"integer\"},\"offset\":{\"description\":\"Start line (0-based)\",\"type\":\"integer\"}},\"required\":[\"file_path\"],\"type\":\"object\"}},\"type\":\"function\"},{\"function\":{\"name\":\"write\",\"strict\":false,\"description\":\"Create or overwrite a file, creating parent dirs; cannot append. View an existing file before overwriting it. For targeted changes use edit or multiedit.\\n\",\"parameters\":{\"properties\":{\"content\":{\"description\":\"Full file content\",\"type\":\"string\"},\"file_path\":{\"description\":\"File path\",\"type\":\"string\"}},\"required\":[\"file_path\",\"content\"],\"type\":\"object\"}},\"type\":\"function\"}]}"
